[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["siteparser"]

[project]
authors = [{ name = "Alexander Hadjiivanov" }]
name = "siteparser"
version = "2025"
requires-python = ">= 3.12"
dependencies = [
    "cloup",
    "ipykernel",
    "networkx",
    "numpy",
    "pyvis",
    "rich",
]
description = "A parser for constructing graphs of device locations."
readme = "README.md"
license = "MIT"

[project.scripts]
siteparser = "siteparser.cli.main:main"
